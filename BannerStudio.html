<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎨 GitHub Portfolio Banner Studio - Standalone Edition</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131b2e;
      --border: #26334d;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #eab308;
      --primary-fg: #09090b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 28px;
      line-height: 1.5;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 { font-size: 22px; font-weight: 800; }
    .header p { font-size: 13px; color: var(--muted); }
    .btn-group { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn {
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s ease;
      background: #1e293b;
      color: var(--text);
    }
    .btn:hover { transform: translateY(-1px); opacity: 0.92; }
    .btn-primary {
      background: linear-gradient(135deg, #fde047, #eab308);
      color: #09090b;
      border-color: #eab308;
    }
    .btn-cyan {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #ffffff;
      border-color: #0284c7;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .field input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    .themes {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .theme-btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .theme-btn.active {
      background: var(--primary);
      color: var(--primary-fg);
      border-color: var(--primary);
    }
    .preview-box {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--border);
      background: #000;
      margin-bottom: 16px;
    }
    .presets {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .presets button {
      background: none;
      border: none;
      color: #38bdf8;
      text-decoration: underline;
      cursor: pointer;
      font-size: 12px;
    }
    #toast {
      display: none;
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      background: #065f46;
      color: #ecfdf5;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>🎨 GitHub Portfolio Banner Studio (Standalone Edition)</h1>
        <p>Gunakan aplikasi ini kapan saja untuk membuat & men-download banner SVG/PNG untuk semua project GitHub Anda!</p>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="downloadSVG()">⬇️ Download SVG</button>
        <button class="btn btn-cyan" onclick="downloadPNG()">🖼️ Download PNG (HD)</button>
        <button class="btn" onclick="copySVGCode()">📋 Copy Kode SVG</button>
      </div>
    </div>

    <div class="themes">
      <button id="btn-vault" class="theme-btn active" onclick="setTheme('vault')">1. Gold NodeVault (Pilihan Anda ⭐)</button>
      <button id="btn-matrix" class="theme-btn" onclick="setTheme('matrix')">2. Hex-Cube Signal</button>
      <button id="btn-prism" class="theme-btn" onclick="setTheme('prism')">3. Hydra Prism</button>
      <button id="btn-orbital" class="theme-btn" onclick="setTheme('orbital')">4. Quantum Radar</button>
      <button id="btn-cyber" class="theme-btn" onclick="setTheme('cyber')">5. Synthwave Pilot</button>
    </div>

    <div class="controls">
      <div class="field">
        <label>Nama Project Utama (Title)</label>
        <input id="titleInput" type="text" value="PROXPOOL" oninput="renderBanner()">
      </div>
      <div class="field">
        <label>Subtitle Tengah</label>
        <input id="subInput" type="text" value="108+ Passive Money Nodes in Docker" oninput="renderBanner()">
      </div>
      <div class="field">
        <label>Tagline Bawah</label>
        <input id="tagInput" type="text" value="HIGH-YIELD DOCKER BANDWIDTH & DEPIN VAULT" oninput="renderBanner()">
      </div>
      <div class="field">
        <label>Simbol / Ikon Tengah (Khusus Gold Vault)</label>
        <input id="iconInput" type="text" value="$" oninput="renderBanner()">
      </div>
    </div>

    <div id="svgContainer" class="preview-box"></div>

    <div class="presets">
      <span>💡 Preset Cepat:</span>
      <button onclick="applyPreset('PROXPOOL', '108+ Passive Money Nodes in Docker', 'HIGH-YIELD DOCKER BANDWIDTH & DEPIN VAULT', '$')">ProxPool (Default)</button> •
      <button onclick="applyPreset('TRAFFNODE V3', 'Hybrid Passive Harvester & Proxy Gateway', '925 WIREGUARD NODES • MULTI-PORT RELAY', '⚡')">TraffNode V3</button> •
      <button onclick="applyPreset('PROXYCHAIN V2', 'Authenticated Multi-Port Proxy Forwarder', 'SOCKS5 • HTTP CONNECT • AUTO HEALTH CHECK', '🔗')">ProxyChain V2</button> •
      <button onclick="applyPreset('VIDARA BOT', 'Automated Stealth Video CPM Engine', 'CAMOUFOX STEALTH • MULTI-SLOT WATCHTIME', '🎬')">Vidara Bot</button>
    </div>

    <div id="toast"></div>
  </div>

  <script>
    let currentTheme = 'vault';

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3500);
    }

    function applyPreset(title, sub, tag, icon) {
      document.getElementById('titleInput').value = title;
      document.getElementById('subInput').value = sub;
      document.getElementById('tagInput').value = tag;
      if (icon) document.getElementById('iconInput').value = icon;
      renderBanner();
    }

    function setTheme(theme) {
      currentTheme = theme;
      ['vault', 'matrix', 'prism', 'orbital', 'cyber'].forEach(t => {
        const btn = document.getElementById('btn-' + t);
        if (btn) btn.className = (t === theme) ? 'theme-btn active' : 'theme-btn';
      });
      renderBanner();
    }

    function escapeXml(unsafe) {
      return (unsafe || '').replace(/[<>&'"]/g, c => ({
        '<': '&lt;', '>': '&gt;', '&': '&amp;', '\'': '&apos;', '"': '&quot;'
      }[c]));
    }

    function buildSVG(theme, title, sub, tag, icon) {
      const safeTitle = escapeXml(title);
      const safeSub = escapeXml(sub);
      const safeTag = escapeXml(tag);
      const safeIcon = escapeXml(icon || '$');

      if (theme === 'vault') {
        return `<svg id="activeSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%">
          <defs>
            <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0c0c0e"/><stop offset="50%" stop-color="#16151a"/><stop offset="100%" stop-color="#09090b"/>
            </linearGradient>
            <linearGradient id="gold4" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fde047"/><stop offset="50%" stop-color="#eab308"/><stop offset="100%" stop-color="#ca8a04"/>
            </linearGradient>
            <radialGradient id="goldGlow" cx="50%" cy="40%" r="40%">
              <stop offset="0%" stop-color="#eab308" stop-opacity="0.14"/><stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <rect width="1200" height="350" fill="url(#bg4)"/>
          <rect width="1200" height="350" fill="url(#goldGlow)"/>
          <line x1="0" y1="3" x2="1200" y2="3" stroke="url(#gold4)" stroke-width="4"/>
          <g transform="translate(600, 118)">
            <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#18181b" stroke="url(#gold4)" stroke-width="4"/>
            <polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22" fill="none" stroke="#fde047" stroke-width="1.2" opacity="0.5"/>
            <text x="0" y="16" font-family="'Segoe UI', sans-serif" font-size="44" font-weight="900" text-anchor="middle" fill="url(#gold4)">${safeIcon}</text>
            <circle cx="-85" cy="0" r="5" fill="#eab308"/><line x1="-80" y1="0" x2="-52" y2="0" stroke="#eab308" stroke-width="2"/>
            <circle cx="85" cy="0" r="5" fill="#eab308"/><line x1="52" y1="0" x2="80" y2="0" stroke="#eab308" stroke-width="2"/>
          </g>
          <text x="600" y="242" font-family="'Segoe UI', sans-serif" font-size="44" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="5">${safeTitle}</text>
          <text x="600" y="278" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="url(#gold4)" letter-spacing="1.5">${safeSub}</text>
          <text x="600" y="314" font-family="monospace" font-size="13" text-anchor="middle" fill="#a1a1aa" letter-spacing="2">${safeTag}</text>
        </svg>`;
      }

      if (theme === 'matrix') {
        return `<svg id="activeSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%">
          <defs>
            <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#060d1f"/><stop offset="50%" stop-color="#0a1936"/><stop offset="100%" stop-color="#040b18"/>
            </linearGradient>
            <radialGradient id="gl1" cx="50%" cy="40%" r="45%">
              <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.22"/><stop offset="100%" stop-color="#060d1f" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffe57f"/><stop offset="100%" stop-color="#ff8f00"/>
            </linearGradient>
          </defs>
          <rect width="1200" height="350" fill="url(#bg1)"/>
          <rect width="1200" height="350" fill="url(#gl1)"/>
          <g stroke="#1e3a6e" stroke-width="1.3" opacity="0.6">
            <line x1="90" y1="70" x2="190" y2="120"/><line x1="190" y1="120" x2="140" y2="210"/><line x1="190" y1="120" x2="310" y2="95"/><line x1="310" y1="95" x2="360" y2="185"/>
            <line x1="1110" y1="70" x2="1010" y2="120"/><line x1="1010" y1="120" x2="1060" y2="210"/><line x1="1010" y1="120" x2="890" y2="95"/><line x1="890" y1="95" x2="840" y2="185"/>
          </g>
          <g fill="#00e5ff" opacity="0.8">
            <circle cx="90" cy="70" r="4"/><circle cx="190" cy="120" r="5"/><circle cx="140" cy="210" r="3.5"/><circle cx="310" cy="95" r="4.5"/><circle cx="360" cy="185" r="5"/>
            <circle cx="1110" cy="70" r="4"/><circle cx="1010" cy="120" r="5"/><circle cx="1060" cy="210" r="3.5"/><circle cx="890" cy="95" r="4.5"/><circle cx="840" cy="185" r="5"/>
          </g>
          <g transform="translate(600, 120)">
            <path d="M 15,-62 A 68,68 0 0,1 62,-15" fill="none" stroke="url(#gold1)" stroke-width="6" stroke-linecap="round"/>
            <path d="M 22,-84 A 92,92 0 0,1 84,-22" fill="none" stroke="url(#gold1)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
            <path d="M 29,-106 A 116,116 0 0,1 106,-29" fill="none" stroke="url(#gold1)" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
            <polygon points="0,-54 47,-27 47,27 0,54 -47,27 -47,-27" fill="#08152c" stroke="#00e5ff" stroke-width="4"/>
            <polygon points="0,-33 29,-16 0,0 -29,-16" fill="#00e5ff"/>
            <polygon points="-29,-16 0,0 0,33 -29,16" fill="#0091ea"/>
            <polygon points="0,0 29,-16 29,16 0,33" fill="#0064b7"/>
            <circle cx="-11" cy="9" r="3" fill="#fff"/><circle cx="0" cy="15" r="3" fill="#fff"/><circle cx="11" cy="9" r="3" fill="#ffe57f"/>
          </g>
          <text x="600" y="242" font-family="'Segoe UI', sans-serif" font-size="42" font-weight="800" text-anchor="middle" fill="#ffffff" letter-spacing="4">${safeTitle}</text>
          <text x="600" y="276" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="url(#gold1)" letter-spacing="1.2">${safeSub}</text>
          <rect x="400" y="296" width="400" height="28" rx="14" fill="#0d2244" stroke="#00e5ff" stroke-width="1"/>
          <text x="600" y="315" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#80d8ff" letter-spacing="1.5">${safeTag}</text>
        </svg>`;
      }

      if (theme === 'prism') {
        return `<svg id="activeSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%">
          <defs>
            <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#090514"/><stop offset="50%" stop-color="#140b29"/><stop offset="100%" stop-color="#070410"/>
            </linearGradient>
          </defs>
          <rect width="1200" height="350" fill="url(#bg2)"/>
          <line x1="120" y1="155" x2="555" y2="120" stroke="#ffffff" stroke-width="5" opacity="0.9"/>
          <line x1="645" y1="105" x2="1080" y2="55" stroke="#ff2a85" stroke-width="4.5"/>
          <line x1="648" y1="112" x2="1080" y2="85" stroke="#ff9100" stroke-width="4.5"/>
          <line x1="650" y1="120" x2="1080" y2="115" stroke="#ffea00" stroke-width="4.5"/>
          <line x1="650" y1="128" x2="1080" y2="145" stroke="#00e676" stroke-width="4.5"/>
          <line x1="648" y1="135" x2="1080" y2="175" stroke="#00e5ff" stroke-width="4.5"/>
          <line x1="645" y1="142" x2="1080" y2="205" stroke="#d500f9" stroke-width="4.5"/>
          <polygon points="600,48 662,158 538,158" fill="#180e2eef" stroke="#00e5ff" stroke-width="4"/>
          <polygon points="600,68 642,146 558,146" fill="none" stroke="#ff2a85" stroke-width="1.5" opacity="0.8"/>
          <text x="600" y="238" font-family="'Segoe UI', sans-serif" font-size="44" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="5">${safeTitle}</text>
          <text x="600" y="274" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#00e5ff" letter-spacing="2">${safeSub}</text>
          <text x="600" y="312" font-family="monospace" font-size="13" text-anchor="middle" fill="#f472b6" letter-spacing="2">${safeTag}</text>
        </svg>`;
      }

      if (theme === 'orbital') {
        return `<svg id="activeSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%">
          <defs>
            <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#021014"/><stop offset="100%" stop-color="#062229"/>
            </linearGradient>
          </defs>
          <rect width="1200" height="350" fill="url(#bg3)"/>
          <g transform="translate(600, 120)">
            <ellipse cx="0" cy="0" rx="180" ry="52" fill="none" stroke="#00e676" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.5"/>
            <ellipse cx="0" cy="0" rx="125" ry="36" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.7"/>
            <circle cx="-120" cy="8" r="6" fill="#00e676"/><circle cx="115" cy="-12" r="6" fill="#00e5ff"/><circle cx="165" cy="18" r="5" fill="#ffea00"/>
            <circle cx="0" cy="0" r="44" fill="#042f36" stroke="#00e676" stroke-width="3.5"/>
            <ellipse cx="0" cy="0" rx="22" ry="44" fill="none" stroke="#00e676" stroke-width="1.5" opacity="0.6"/>
            <line x1="-44" y1="0" x2="44" y2="0" stroke="#00e676" stroke-width="1.5" opacity="0.6"/>
            <circle cx="0" cy="0" r="9" fill="#00e676"/>
          </g>
          <text x="600" y="242" font-family="'Segoe UI', sans-serif" font-size="44" font-weight="800" text-anchor="middle" fill="#ecfdf5" letter-spacing="4">${safeTitle}</text>
          <text x="600" y="278" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#00e676" letter-spacing="1.5">${safeSub}</text>
          <text x="600" y="314" font-family="monospace" font-size="13" text-anchor="middle" fill="#6ee7b7" letter-spacing="2">${safeTag}</text>
        </svg>`;
      }

      // Theme 5: Synthwave Pilot
      return `<svg id="activeSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%">
        <defs>
          <linearGradient id="bg5" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#050510"/><stop offset="65%" stop-color="#0d0826"/><stop offset="100%" stop-color="#1a0933"/>
          </linearGradient>
          <linearGradient id="sun5" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffcc00"/><stop offset="50%" stop-color="#ff2a85"/><stop offset="100%" stop-color="#7900ff"/>
          </linearGradient>
        </defs>
        <rect width="1200" height="350" fill="url(#bg5)"/>
        <line x1="0" y1="260" x2="1200" y2="260" stroke="#00e5ff" stroke-width="1.5" opacity="0.6"/>
        <circle cx="950" cy="155" r="85" fill="url(#sun5)"/>
        <text x="450" y="170" font-family="'Segoe UI', sans-serif" font-size="82" font-weight="900" text-anchor="middle" fill="#ff5c7c" letter-spacing="2">${safeTitle}</text>
        <text x="450" y="215" font-family="monospace" font-size="20" font-weight="700" text-anchor="middle" fill="#00f0ff" letter-spacing="5">${safeSub}</text>
        <text x="450" y="305" font-family="monospace" font-size="14" text-anchor="middle" fill="#cbd5e1" letter-spacing="2">${safeTag}</text>
      </svg>`;
    }

    function renderBanner() {
      const title = document.getElementById('titleInput').value || 'PROXPOOL';
      const sub = document.getElementById('subInput').value || '108+ Passive Money Nodes in Docker';
      const tag = document.getElementById('tagInput').value || 'HIGH-YIELD DOCKER BANDWIDTH & DEPIN VAULT';
      const icon = document.getElementById('iconInput').value || '$';
      document.getElementById('svgContainer').innerHTML = buildSVG(currentTheme, title, sub, tag, icon);
    }

    function downloadSVG() {
      const svgEl = document.getElementById('activeSvg');
      if (!svgEl) return;
      const svgData = new XMLSerializer().serializeToString(svgEl);
      const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const name = (document.getElementById('titleInput').value || 'banner').toLowerCase().replace(/\s+/g, '_');
      a.href = url;
      a.download = name + '_banner.svg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('✅ File SVG berhasil di-download!');
    }

    function downloadPNG() {
      const svgEl = document.getElementById('activeSvg');
      if (!svgEl) return;
      const svgData = new XMLSerializer().serializeToString(svgEl);
      const canvas = document.createElement('canvas');
      canvas.width = 2400; // 2x Retina Ultra-HD
      canvas.height = 700;
      const ctx = canvas.getContext('2d');
      const img = new Image();
      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      img.onload = function() {
        ctx.drawImage(img, 0, 0, 2400, 700);
        URL.revokeObjectURL(url);
        const pngUrl = canvas.toDataURL('image/png');
        const a = document.createElement('a');
        const name = (document.getElementById('titleInput').value || 'banner').toLowerCase().replace(/\s+/g, '_');
        a.href = pngUrl;
        a.download = name + '_banner_hd.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('✅ File PNG Ultra-HD (2400x700) berhasil di-download!');
      };
      img.src = url;
    }

    function copySVGCode() {
      const svgEl = document.getElementById('activeSvg');
      if (!svgEl) return;
      const svgData = new XMLSerializer().serializeToString(svgEl);
      navigator.clipboard.writeText(svgData).then(() => {
        showToast('📋 Kode SVG berhasil disalin ke Clipboard! Tinggal paste ke file .svg');
      });
    }

    renderBanner();
  </script>
</body>
</html>
